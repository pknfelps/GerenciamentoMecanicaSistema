apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-gerenciamento-api
  labels:
    app: gerenciamento-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gerenciamento-api
  template:
    metadata:
      name: pod-gerenciamento-api
      labels:
        app: gerenciamento-api
    spec:
      containers:
        - name: gerenciamento-api
          image: felipejesusoliveira/gerenciamentomecanicasistema
          ports:
          - containerPort: 8080
            protocol: TCP
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: CONNECTION_STRING
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: JWT_KEY
          resources:
            limits:
              cpu: "0.75"
              memory: "512Mi"
            requests:
              cpu: "0.2"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
