apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base
  - service-account.yaml

images:
  - name: felipejesusoliveira/gerenciamentomecanicasistema
    newName: 121754142617.dkr.ecr.us-east-1.amazonaws.com/mecanica/api
    newTag: pending

patches:
  - target:
      kind: Deployment
      name: deploy-gerenciamento-api
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: gerenciamento-api
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 12
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: Runtime__Environment
            value: prd
          - name: AWS_REGION
            value: us-east-1
          - name: AWS_EC2_METADATA_DISABLED
            value: "true"
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: OTEL_SERVICE_NAME
            value: mecanica-api
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: deployment.environment.name=prd
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector.observability.svc.cluster.local:4318
          - name: Telemetry__Enabled
            value: "false"
