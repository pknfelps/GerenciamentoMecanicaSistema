$kind: http-request
name: RegisterCustomer
url: '{{base_url}}/Customers'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "Name": "Cliente Teste",
      "Document": "{{new_customer_document}}",
      "Phone": "11912345678",
      "Email": "cliente.auth14@example.invalid"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test("Cadastro operacional e acesso ao cliente confirmados", () => {
      pm.response.to.have.status(201);
    });
  language: text/javascript
