$kind: http-request
name: UpdateCustomer
url: '{{base_url}}/Customers/{{customer_id}}'
method: PATCH
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "Name": "Ciclano",
      "Document": "{{customer_document}}",
      "Phone": "11912345678",
      "Email": "ciclano.update@gmail.com"
    }
