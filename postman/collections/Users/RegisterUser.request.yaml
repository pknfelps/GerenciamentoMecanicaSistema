$kind: http-request
name: RegisterUser
url: '{{gateway_url}}/Users'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{admin_token}}'
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: '{{identity_body}}'
scripts:
- type: beforeRequest
  code: |-
    pm.environment.unset("user_id");
    pm.environment.unset("test_user_token");
    pm.variables.set("identity_body", JSON.stringify({
      name: pm.environment.get("test_user_name"),
      password: pm.environment.get("test_user_password"),
      role: "Mechanic"
    }));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("Conta cadastrada", () => {
      pm.response.to.have.status(201);
    });
  language: text/javascript
