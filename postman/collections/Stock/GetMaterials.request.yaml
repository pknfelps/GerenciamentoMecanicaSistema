$kind: http-request
name: GetMaterials
url: '{{base_url}}/Stock'
method: GET
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
queryParams:
- key: id
  value: null
  disabled: true
- key: name
  value: null
  disabled: true
- key: brand
  value: null
  disabled: true
