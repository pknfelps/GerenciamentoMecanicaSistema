$kind: http-request
name: RegisterMaterial
url: '{{base_url}}/stock'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "Name": "Óleo de motor",
      "Brand": "Lubrax",
      "Price": 10.99,
      "Amount": 10
    }
