$kind: http-request
name: Login
url: '{{gateway_url}}/Authentication'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: '{{identity_body}}'
scripts:
- type: beforeRequest
  code: |-
    pm.environment.unset("admin_token");
    pm.variables.set("identity_body", JSON.stringify({
      name: pm.environment.get("admin_name"),
      password: pm.environment.get("admin_password"),
      role: "Admin"
    }));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("Login retorna um JWT como string JSON", () => {
      pm.response.to.have.status(200);
      const token = pm.response.json();
      pm.expect(token).to.match(/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/);
      pm.environment.set("admin_token", token);
    });
  language: text/javascript
