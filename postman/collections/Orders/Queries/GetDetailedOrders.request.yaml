$kind: http-request
name: GetDetailedOrders
url: '{{base_url}}/orders/details?id={{order_id}}'
method: GET
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
queryParams:
- key: id
  value: '{{order_id}}'
  disabled: false
  description: ''
- key: vehicleLicensePlate
  value: ''
  disabled: true
  description: ''
