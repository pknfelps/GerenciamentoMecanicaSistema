$kind: http-request
name: CreateOrder
url: "{{base_url}}/orders"
method: POST
body:
  type: json
  content: "{\r

    \    \"customerId\": \"{{customer_id}}\",\r

    \    \"vehicleId\": \"{{vehicle_id}}\",\r

    \    \"services\": [\r

    \        {\r

    \            \"id\": \"{{service_id}}\",\r

    \            \"value\": 1\r

    \        }\r

    \    ],\r

    \    \"materials\": [\r

    \        {\r

    \            \"id\": \"{{material_id}}\",\r

    \            \"value\": 1\r

    \        }\r

    \    ]\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Ordem criada com sucesso", () => {
        pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
        const response = pm.response.json();
        pm.collectionVariables.set("order_id", response.id);
      }
    language: text/javascript
order: 1000
