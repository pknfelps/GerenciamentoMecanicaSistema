$kind: http-request
name: CreateOrder
url: '{{base_url}}/orders'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "customerId": "{{customer_id}}",
      "vehicleId": "{{vehicle_id}}",
      "services": [
        {
          "id": "{{service_id}}",
          "value": 1
        }
      ],
      "materials": [
        {
          "id": "{{material_id}}",
          "value": 1
        }
      ]
    }
scripts:
- type: afterResponse
  code: |-
    pm.test("Ordem criada com sucesso", () => {
      pm.response.to.have.status(201);
    });

    if (pm.response.code === 201) {
      const response = pm.response.json();
      pm.environment.set("order_id", response.id);
    }
  language: text/javascript
