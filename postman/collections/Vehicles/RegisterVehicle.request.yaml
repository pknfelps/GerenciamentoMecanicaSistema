$kind: http-request
name: RegisterVehicle
url: '{{base_url}}/vehicles'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "CustomerDocument": "{{customer_document}}",
      "Brand": "Honda",
      "Model": "Civic",
      "Year": 2025,
      "LicensePlate": "{{vehicle_license_plate}}"
    }
