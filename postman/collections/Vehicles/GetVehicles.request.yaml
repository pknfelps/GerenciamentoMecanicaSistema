$kind: http-request
name: GetVehicles
url: '{{base_url}}/vehicles'
method: GET
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
queryParams:
- key: id
  value: ''
  disabled: true
- key: licensePlate
  value: '{{vehicle_license_plate}}'
scripts:
- type: afterResponse
  code: |-
    if (pm.response.code === 200) {
      const vehicles = pm.response.json();

      if (vehicles.length > 0) {
        pm.environment.set("vehicle_id", vehicles[0].id);
      }
    }
  language: text/javascript
