$kind: http-request
url: "{{base_url}}/vehicles/{{vehicle_id}}"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{mechanic_token}}"
body:
  type: json
  content: "{\r

    \    \"CustomerDocument\": \"{{customer_document}}\",\r

    \    \"Brand\": \"Honda\",\r

    \    \"Model\": \"Civic\",\r

    \    \"Year\": 2020,\r

    \    \"LicensePlate\": \"{{vehicle_license_plate}}\"\r

    }"
order: 3000
