$kind: http-request
name: UpdateVehicle
url: '{{base_url}}/vehicles/{{vehicle_id}}'
method: PATCH
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "CustomerDocument": "{{customer_document}}",
      "Brand": "Honda",
      "Model": "Civic",
      "Year": 2020,
      "LicensePlate": "{{vehicle_license_plate}}"
    }
