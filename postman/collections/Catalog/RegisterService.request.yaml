$kind: http-request
name: RegisterService
url: '{{base_url}}/catalog'
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "Description": "Troca de Óleo",
      "Hours": 1,
      "PricePerHour": 50,
      "Amount": 1
    }
