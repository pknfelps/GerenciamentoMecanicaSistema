$kind: http-request
name: UpdateService
url: '{{base_url}}/catalog/{{service_id}}'
method: PATCH
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{mechanic_token}}'
body:
  type: json
  content: |
    {
      "Description": "Troca Óleo",
      "Hours": 2,
      "PricePerHour": 15,
      "Amount": 1
    }
