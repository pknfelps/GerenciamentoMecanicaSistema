name: gerenciamento-mecanica

services:
  api:
    image: gerenciamento-mecanica-api:local
    build:
      context: .
      dockerfile: GerenciamentoMecanicaSistema/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      Jwt__Audience: ${JWT_AUDIENCE:-mecanica}
      Jwt__Issuer: ${JWT_ISSUER:-admin}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no arquivo .env}
      Email__InvocationEndpoint: ${EMAIL_INVOCATION_ENDPOINT:-http://host.docker.internal:3001}
      Email__FunctionName: EmailFunction
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      smtp:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    init: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  smtp:
    image: rnwood/smtp4dev:3.15.0
    ports:
      - "127.0.0.1:${SMTP_WEB_PORT:-3000}:80"
      - "127.0.0.1:${SMTP_PORT:-2525}:25"
    working_dir: /app
    environment:
      HOME: /smtp4dev
    configs:
      - source: smtp4dev_settings
        target: /app/appsettings.json
    tmpfs:
      - /smtp4dev:noexec,nosuid,size=32m
      - /tmp:noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    init: true

volumes:
  db_data:

configs:
  smtp4dev_settings:
    file: ./deploy/smtp4dev/appsettings.json
