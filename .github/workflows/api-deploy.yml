name: API deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de publicação e deploy
        required: true
        type: choice
        options: [hom, prd]

permissions:
  contents: read

concurrency:
  group: api-deploy-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_ACCOUNT_ID: '121754142617'
  ECR_REPOSITORY: mecanica/api

jobs:
  publish:
    name: Publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout da revisão da execução
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar contexto
        run: |
          test "$GITHUB_REPOSITORY" = pknfelps/GerenciamentoMecanicaSistema
          case "$DEPLOY_ENVIRONMENT:$GITHUB_REF" in
            hom:refs/heads/develop|prd:refs/heads/main) ;;
            *) echo '::error::Use develop/hom ou main/prd'; exit 1 ;;
          esac
          test "$AWS_REGION" = us-east-1
          test "$AWS_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/mecanica/pipelines/mecanica-$DEPLOY_ENVIRONMENT-api-github"

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build e testes Release
        run: |
          dotnet restore GerenciamentoMecanicaSistema.slnx
          dotnet build GerenciamentoMecanicaSistema.slnx --configuration Release --no-restore
          dotnet test GerenciamentoMecanicaSistema.slnx --configuration Release --no-build --no-restore

      - name: Autenticar na AWS por OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '121754142617'
          role-session-name: api-publish-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Conferir identidade e repositório ECR
        id: repository
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          identity="$(aws sts get-caller-identity --query Arn --output text)"
          case "$identity" in
            "arn:aws:sts::$AWS_ACCOUNT_ID:assumed-role/mecanica-$DEPLOY_ENVIRONMENT-api-github/"*) ;;
            *) echo '::error::Role AWS inesperada'; exit 1 ;;
          esac
          repository="$(aws ssm get-parameter --name "/mecanica/$DEPLOY_ENVIRONMENT/base/v2/ecr-repository-url" --query Parameter.Value --output text)"
          test "$repository" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          echo "url=$repository" >> "$GITHUB_OUTPUT"

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir e publicar imagem
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: GerenciamentoMecanicaSistema/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.repository.outputs.url }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Entregar imagem por digest
        id: image
        env:
          REPOSITORY_URL: ${{ steps.repository.outputs.url }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$REPOSITORY_URL@$IMAGE_DIGEST"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
          printf 'Ambiente: `%s`\n\nCommit: `%s`\n\nImagem: `%s`\n\nTag: `sha-%s-%s-%s`\n' \
            "$DEPLOY_ENVIRONMENT" "$GITHUB_SHA" "$image" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Implantar
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      IMAGE_URI: ${{ needs.publish.outputs.image-uri }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Checkout da mesma revisão
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar contexto
        run: |
          test "$GITHUB_REPOSITORY" = pknfelps/GerenciamentoMecanicaSistema
          case "$DEPLOY_ENVIRONMENT:$GITHUB_REF" in
            hom:refs/heads/develop|prd:refs/heads/main) ;;
            *) echo '::error::Use develop/hom ou main/prd'; exit 1 ;;
          esac
          test "$AWS_REGION" = us-east-1
          test "$AWS_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/mecanica/pipelines/mecanica-$DEPLOY_ENVIRONMENT-api-github"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$IMAGE_URI" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY@$IMAGE_DIGEST"

      - name: Autenticar na AWS por OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '121754142617'
          role-session-name: api-deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Conferir identidade, configuração e digest
        id: target
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          identity="$(aws sts get-caller-identity --query Arn --output text)"
          case "$identity" in
            "arn:aws:sts::$AWS_ACCOUNT_ID:assumed-role/mecanica-$DEPLOY_ENVIRONMENT-api-github/"*) ;;
            *) echo '::error::Role AWS inesperada'; exit 1 ;;
          esac
          cluster="$(aws ssm get-parameter --name "/mecanica/$DEPLOY_ENVIRONMENT/base/v2/cluster-name" --query Parameter.Value --output text)"
          namespace="$(aws ssm get-parameter --name "/mecanica/$DEPLOY_ENVIRONMENT/base/v2/namespace" --query Parameter.Value --output text)"
          test "$cluster" = "mecanica-$DEPLOY_ENVIRONMENT-eks"
          test "$namespace" = default
          available="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids "imageDigest=$IMAGE_DIGEST" --query 'images[0].imageId.imageDigest' --output text)"
          test "$available" = "$IMAGE_DIGEST"
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.1

      - name: Instalar Kustomize 5.8.3
        run: |
          mkdir -p "$RUNNER_TEMP/kustomize"
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP/kustomize"
          echo "$RUNNER_TEMP/kustomize" >> "$GITHUB_PATH"

      - name: Configurar acesso ao cluster
        id: kubeconfig
        env:
          CLUSTER_NAME: ${{ steps.target.outputs.cluster }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$RUNNER_TEMP/api-kubeconfig"

      - name: Aplicar overlay com a imagem publicada
        env:
          KUBECONFIG: ${{ runner.temp }}/api-kubeconfig
        run: |
          cd "deploy/kubernetes/overlays/$DEPLOY_ENVIRONMENT"
          kustomize edit set image "felipejesusoliveira/gerenciamentomecanicasistema=$IMAGE_URI"
          kubectl apply -k .

      - name: Aguardar rollout e conferir imagem
        env:
          KUBECONFIG: ${{ runner.temp }}/api-kubeconfig
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          kubectl rollout status deployment/deploy-gerenciamento-api --namespace "$NAMESPACE" --timeout=600s
          configured="$(kubectl get deployment deploy-gerenciamento-api --namespace "$NAMESPACE" -o 'jsonpath={.spec.template.spec.containers[?(@.name=="gerenciamento-api")].image}')"
          test "$configured" = "$IMAGE_URI"
          printf 'Deploy concluído em `%s/default`.\n\nCommit: `%s`\n\nImagem: `%s`\n' \
            "$DEPLOY_ENVIRONMENT" "$GITHUB_SHA" "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico de falha
        if: ${{ failure() && steps.kubeconfig.outcome == 'success' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/api-kubeconfig
        run: |
          kubectl describe deployment deploy-gerenciamento-api --namespace default || true
          kubectl get pods --namespace default -l app=gerenciamento-api -o wide || true
          kubectl describe pods --namespace default -l app=gerenciamento-api | tail -n 200 || true
          kubectl get events --namespace default --sort-by=.metadata.creationTimestamp | tail -n 40 || true
          kubectl logs --namespace default -l app=gerenciamento-api --all-containers=true --prefix --tail=100 --max-log-requests=10 || true
          kubectl logs --namespace default -l app=gerenciamento-api --all-containers=true --prefix --previous --tail=100 --max-log-requests=10 || true
          exit 1
