name: pipeline
on:
  push: 

env:
  IMAGE_NAME: felipejesusoliveira/gerenciamentomecanicasistema
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install dotnet-coverage
        run: dotnet tool install dotnet-coverage --tool-path ${{ runner.temp }}/tools

      - name: Restore dependencies
        run: dotnet restore GerenciamentoMecanicaSistema.slnx

      - name: Build
        run: dotnet build GerenciamentoMecanicaSistema.slnx --no-restore

      - name: Run Unit Tests
        run: ${{ runner.temp }}/tools/dotnet-coverage collect "dotnet test GerenciamentoMecanicaSistema.slnx --no-build --no-restore" -f xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GerenciamentoMecanicaSistema.slnx

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Cache SonarQube Cloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Sonar Cloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin /k:"pknfelps_GerenciamentoMecanicaSistema" /o:"pknfelps" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          dotnet build GerenciamentoMecanicaSistema.slnx --no-restore
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  build-and-publish:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - code-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Docker Login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: 'felipejesusoliveira'
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build --file ./GerenciamentoMecanicaSistema/Dockerfile --tag "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Publish Image
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - unit-tests
      - code-analysis
      - build-and-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: us-east-1

      - name: Update Kube Config
        run: aws eks update-kubeconfig --name api-cluster --region us-east-1

      - name: Configure Kubernetes secrets
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          kubectl create secret generic db-secrets \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=CONNECTION_STRING="Host=svc-gerenciamento-db;Port=5432;Database=$POSTGRES_DB;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD" \
            --from-literal=JWT_KEY="$JWT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        working-directory: deploy/kubernetes
        run: |
          kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${IMAGE_TAG}"
          kubectl apply -k .
